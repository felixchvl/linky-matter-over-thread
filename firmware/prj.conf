# Matter
CONFIG_CHIP=y
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/linky.zap"
CONFIG_CHIP_DEVICE_VENDOR_NAME="linky-matter-over-thread"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Linky TIC"
# Test vendor and product IDs: commission with the test DCL enabled.
CONFIG_CHIP_DEVICE_PRODUCT_ID=32768
CONFIG_STD_CPP17=y
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60
CONFIG_BT_DEVICE_NAME="LinkyMatter"
CONFIG_BT_DEVICE_NAME_MAX=18

# No external flash, no bootloader: no Matter OTA.
CONFIG_CHIP_BOOTLOADER_NONE=y
CONFIG_CHIP_OTA_REQUESTOR=n
CONFIG_CHIP_FACTORY_DATA=y
CONFIG_CHIP_FACTORY_DATA_BUILD=y
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n

# Status LED and pairing button (short press: advertise, long press: factory reset).
CONFIG_DK_LIBRARY=y

# TIC input and the input voltage monitor.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_ADC=y

# Debug output on J2 (TX only, no shell).
CONFIG_SHELL=n
CONFIG_CHIP_LIB_SHELL=n
CONFIG_OPENTHREAD_SHELL=n
CONFIG_USE_SEGGER_RTT=n

CONFIG_PM_DEVICE=y
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=y

# Test event triggers are only useful for certification.
CONFIG_NCS_SAMPLE_MATTER_TEST_EVENT_TRIGGERS=n
